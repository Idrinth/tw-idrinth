# Selene standard library definition for Total War Idrinth mod
# Combines lua51 base with Total War game API and Idrinth namespace

name: tw_idrinth
base: lua51

structs:
  # Core object struct
  Core:
    add_listener:
      method: true
      args: []
    get_or_create_component:
      method: true
      args: []
    get_ui_root:
      method: true
      args: []
    is_ui_created:
      method: true
      args: []
    trigger_custom_event:
      method: true
      args: []

  # Campaign manager struct
  CampaignManager:
    add_experience_to_unit:
