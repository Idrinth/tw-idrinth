# Selene standard library definition for Total War Idrinth mod
# Combines lua51 base with Total War game API and Idrinth namespace

name: tw_idrinth
base: lua51

globals:
  # ============================================
  # Total War Game API (from tw_game)
  # ============================================

  # Core object
  core: {}
  core.add_listener: {}
  core.get_or_create_component: {}
  core.get_ui_root: {}
  core.is_ui_created: {}
  core.trigger_custom_event: {}

  # Campaign manager object
  cm: {}
  cm.add_experience_to_unit: {}
