# Selene standard library definition for Total War Idrinth mod
# Combines lua51 base with Total War game API and Idrinth namespace

name: tw_idrinth
base: lua51

globals:
  # ============================================
  # Total War Game API
  # ============================================

  # Core object
  core:
    property: read-only
    struct:
      add_listener:
        method: true
      get_or_create_component:
        method: true
      get_ui_root:
        method: true
      is_ui_created:
        method: true
      trigger_custom_event:
        method: true

  # Campaign manager object
  cm:
    property: read-only
    struct:
      add_experience_to_unit:
        method: true
      add_first_tick_callback:
        method: true
      add_foreign_slot_set_to_region_for_faction:
        method: true
      add_loading_game_callback:
        method: true
      add_pooled_resource_changed_listener_by_faction:
        method: true
      add_pre_first_tick_callback:
        method: true
      add_saving_game_callback:
        method: true
      apply_effect_bundle:
        method: true
      apply_effect_bundle_to_character:
        method: true
      apply_effect_bundle_to_region:
        method: true
      callback:
        method: true
      cancel_custom_mission:
        method: true
      change_character_custom_name:
        method: true
      change_custom_unit_name:
        method: true
      char_lookup_str:
        method: true
      create_force_with_general:
        method: true
      disable_event_feed_events:
        method: true
      faction_add_pooled_resource:
        method: true
      faction_purchase_unit_effect:
        method: true
      faction_set_unit_purchasable_effect_lock_state:
        method: true
      find_valid_spawn_location_for_character_from_position:
        method: true
      force_add_ancillary:
        method: true
      force_add_trait:
        method: true
      force_remove_ancillary_from_faction:
        method: true
      force_remove_trait:
        method: true
      get_campaign_ui_manager:
        method: true
      get_character_by_cqi:
        method: true
      get_factions_by_culture:
        method: true
      get_highest_ranked_general_for_faction:
        method: true
      get_local_faction:
        method: true
      get_most_recently_created_character_of_type:
        method: true
      grant_unit_to_character:
        method: true
      is_multiplayer:
        method: true
      is_new_game:
        method: true
      load_global_script:
        method: true
      load_named_value:
        method: true
      mission_is_active_for_faction:
        method: true
      model:
        method: true
      pending_battle_cache_attacker_value:
        method: true
      pending_battle_cache_attacker_victory:
        method: true
      pending_battle_cache_culture_is_attacker:
        method: true
      pending_battle_cache_culture_is_defender:
        method: true
      pending_battle_cache_defender_value:
        method: true
      pending_battle_cache_defender_victory:
        method: true
      pending_battle_cache_get_attacker:
        method: true
      pending_battle_cache_get_attacker_embedded_character_subtypes:
        method: true
      pending_battle_cache_get_defender:
        method: true
      pending_battle_cache_get_defender_embedded_character_subtypes:
        method: true
      pending_battle_cache_num_attackers:
        method: true
      pending_battle_cache_num_defenders:
        method: true
      pooled_resource_factor_transaction:
        method: true
      random:
        method: true
      random_number:
        method: true
      real_callback:
        method: true
      remove_effect_bundle_from_region:
        method: true
      remove_faction_foreign_slots_from_region:
        method: true
      repeat_real_callback:
        method: true
      replenish_action_points:
        method: true
      save_named_value:
        method: true
      set_character_immortality:
        method: true
      set_character_unique:
        method: true
      show_message_event:
        method: true
      show_message_event_located:
        method: true
      spawn_transported_force_at_military_force:
        method: true
      spawn_unique_agent_at_character:
        method: true
      spawn_unique_agent_at_region:
        method: true
      treasury_mod:
        method: true
      trigger_dilemma:
        method: true
      trigger_mission:
        method: true

  # Common utilities
  common:
    property: read-only
    struct:
      call_context_command:
        method: true
      get_context_value:
        method: true
      get_localised_string:
        method: true

  # Simple read-only globals
  is_string:
    args:
      - type: any
  is_integer:
    args:
      - type: any
  UIComponent:
    args:
      - type: any
  is_uicomponent:
    args:
      - type: any
  get_mct:
    args: []
  set_component_visible_with_parent:
    args:
      - type: any
      - type: bool
  out:
    args:
      - type: string

  # ============================================
  # Idrinth Mod Namespace
  # ============================================

  # Main Idrinth namespace - needs full-write to allow Idrinth = {}
  Idrinth:
    property: full-write
    struct:
      Access:
        property: read-only
        struct:
          get:
            args: []
          spawned:
            args: []
      Constants:
        property: read-only
        struct:
          Cultures:
            property: read-only
            struct:
              DarkElves:
                property: read-only
              HighElves:
                property: read-only
              WoodElves:
                property: read-only
          GodList:
            property: read-only
          Gods:
            property: read-only
            struct:
              Asuryan:
                property: read-only
              Khaine:
                property: read-only
              Kurnous:
                property: read-only
          HeroSubtype:
            property: read-only
          HeroType:
            property: read-only
          LordSubtype:
            property: read-only
          LordType:
            property: read-only
          MctModKey:
            property: read-only
          Panels:
            property: read-only
            struct:
              HudCampaign:
                property: read-only
          UnlockDilemma:
            property: read-only
      Cultures:
        property: read-only
        struct:
          get:
            args: []
          isAllowed:
            args:
              - type: string
      Events:
        property: read-only
        struct:
          Conditions:
            property: read-only
            struct:
              battleFoughtAndSpawned:
                args: []
              dilemmaIs:
                args:
                  - type: string
              isPanelOpen:
                args:
                  - type: string
              panelOpened:
                args:
                  - type: string
          addListener:
            args:
              - type: string
              - type: function
              - type: function
          onMctChange:
            args:
              - type: function
      Mct:
        property: read-only
        struct:
          get:
            args:
              - type: string
      Names:
        property: read-only
      Statistics:
        property: read-only
        struct:
          ActiveRounds:
            property: read-only
          BattlesFought:
            property: read-only
          CharactersAssassinated:
            property: read-only
      Ui:
        property: read-only
        struct:
          countChildrenWhere:
            args:
              - type: any
              - type: function
          createOrFind:
            args:
              - type: any
              - type: string
          findChildWhere:
            args:
              - type: any
              - type: function
          findElementWithin:
            args:
              - type: any
              - type: string
          forEachChild:
            args:
              - type: any
              - type: function
          nowAndThen:
            args:
              - type: any
              - type: function
      Unittypes:
        property: read-only
        struct:
          isBlessedAnimal:
            args:
              - type: string
          isChapelUnit:
            args:
              - type: string
          isEliteTroop:
            args:
              - type: string
          isEnlargedCavalry:
            args:
              - type: string
          isEnlargedEliteTroop:
            args:
              - type: string
          isHero:
            args:
              - type: string
          isPriest:
            args:
              - type: string
          isSingleEntity:
            args:
              - type: string
          isVampiric:
            args:
              - type: string
          isVarghulf:
            args:
              - type: string
      Version:
        property: read-only
        struct:
          bug:
            property: read-only
          feature:
            property: read-only
          main:
            property: read-only
      factions:
        property: read-only
      log:
        args:
          - type: string
      mayConfigure:
        args: []
