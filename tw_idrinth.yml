  # ============================================
  # Idrinth Mod Namespace
  # ============================================

  # Main Idrinth namespace - needs full-write to allow Idrinth = {}
  Idrinth:
    property: full-write
    struct:
      Access:
        struct:
          get: {}
          spawned: {}
      Constants:
        struct:
          Cultures:
            struct:
