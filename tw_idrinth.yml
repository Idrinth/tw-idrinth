    is_multiplayer:
      method: true
      args: []
    is_new_game:
      method: true
      args: []
    load_global_script:
      method: true
      args: []
    load_named_value:
      method: true
      args: []
    mission_is_active_for_faction:
      method: true
      args: []
    model:
      method: true
      args: []
    pending_battle_cache_attacker_value:
      method: true
      args: []
    pending_battle_cache_attacker_victory:
      method: true
      args: []
    pending_battle_cache_culture_is_attacker:
