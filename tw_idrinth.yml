# Selene standard library definition for Total War Idrinth mod
# Combines lua51 base with Total War game API and Idrinth namespace

name: tw_idrinth
base: lua51

globals:
  # ============================================
  # Total War Game API
  # ============================================
  # Using any: true for game engine objects since they have
  # extensive APIs that are externally defined

  core:
    any: true

  cm:
    any: true

  common:
    any: true

  # Simple read-only globals
  is_string: {}
  is_integer: {}
  UIComponent: {}
  is_uicomponent: {}
  get_mct: {}
  set_component_visible_with_parent: {}
  out: {}

  # ============================================
  # Idrinth Mod Namespace
  # ============================================

  # Main Idrinth namespace - needs full-write to allow Idrinth = {}
  # Using struct for validation since this is our own code
  Idrinth:
    property: full-write
    struct:
      Access:
        struct:
          get: {}
          spawned: {}
      Constants:
        struct:
          Cultures:
            struct:
              DarkElves: {}
              HighElves: {}
              WoodElves: {}
          GodList: {}
          Gods:
            struct:
              Asuryan: {}
              Khaine: {}
              Kurnous: {}
          HeroSubtype: {}
          HeroType: {}
          LordSubtype: {}
          LordType: {}
          MctModKey: {}
          Panels:
            struct:
              HudCampaign: {}
          UnlockDilemma: {}
      Cultures:
        struct:
          get: {}
          isAllowed: {}
      Events:
        struct:
          Conditions:
            struct:
              battleFoughtAndSpawned: {}
              dilemmaIs: {}
              isPanelOpen: {}
              panelOpened: {}
          addListener: {}
          onMctChange: {}
      Mct:
        struct:
          get: {}
      Names: {}
      Statistics:
        struct:
          ActiveRounds: {}
          BattlesFought: {}
          CharactersAssassinated: {}
      Ui:
        struct:
          countChildrenWhere: {}
          createOrFind: {}
          findChildWhere: {}
          findElementWithin: {}
          forEachChild: {}
          nowAndThen: {}
      Unittypes:
        struct:
          isBlessedAnimal: {}
          isChapelUnit: {}
          isEliteTroop: {}
          isEnlargedCavalry: {}
          isEnlargedEliteTroop: {}
          isHero: {}
          isPriest: {}
          isSingleEntity: {}
          isVampiric: {}
          isVarghulf: {}
      Version:
        struct:
          bug: {}
          feature: {}
          main: {}
      factions: {}
      log: {}
      mayConfigure: {}
