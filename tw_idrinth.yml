# Selene standard library definition for Total War Idrinth mod
# Inherits Total War: Warhammer 3 base game API from twwh3

name: tw_idrinth
base: twwh3

structs:
  IdrinthAccess:
    get:
      args:
      - type:
          display: Faction
        required: false
    spawned:
      args:
      - type:
          display: Faction
        required: false

  IdrinthConstantsCultures:
    DarkElves:
      property: read-only
    HighElves:
      property: read-only
    WoodElves:
      property: read-only

  IdrinthConstantsGods:
    Asuryan:
      property: read-only
    Khaine:
      property: read-only
    Kurnous:
      property: read-only

  IdrinthConstantsPanels:
    HudCampaign:
      property: read-only

  IdrinthConstants:
    Cultures:
      struct: IdrinthConstantsCultures
    GodList:
      property: read-only
    Gods:
      struct: IdrinthConstantsGods
    HeroSubtype:
      property: read-only
    HeroType:
      property: read-only
    LordSubtype:
      property: read-only
    LordType:
      property: read-only
    MctModKey:
      property: read-only
    Panels:
      struct: IdrinthConstantsPanels
    UnlockDilemma:
      property: read-only

  IdrinthCultures:
    get:
      args: []
    isAllowed:
      args:
        - type: string

  IdrinthEventsConditions:
    battleFoughtAndSpawned:
      args: []
    dilemmaIs:
      args:
        - type: string
    isPanelOpen:
      args:
        - type: string
    panelOpened:
      args:
        - type: string

  IdrinthEvents:
    Conditions:
      struct: IdrinthEventsConditions
    addListener:
      args:
        - type: string
        - type: function
        - type: function
    onMctChange:
      args:
        - type: function

  IdrinthMct:
    get:
      args:
        - type: string

  IdrinthStatistics:
    ActiveRounds:
      property: read-only
    BattlesFought:
      property: read-only
    CharactersAssassinated:
      property: read-only

  IdrinthUi:
    countChildrenWhere:
      args:
        - type:
            display: UIComponent
        - type: function
    createOrFind:
      args:
        - type: string
        - type:
            display: UIComponent
          required: false
        - type: "..."
    filterChildren:
      args:
        - type:
            display: UIComponent
        - type: function
    findChildWhere:
      args:
        - type:
            display: UIComponent
        - type: function
    findElementWithin:
      args:
        - type:
            display: UIComponent
          required: false
        - type: string
    forEachChild:
      args:
        - type:
            display: UIComponent
        - type: function
    nowAndThen:
      args:
        - type: function

  IdrinthUnittypes:
    isBlessedAnimal:
      args:
        - type: string
    isChapelUnit:
      args:
        - type: string
    isEliteTroop:
      args:
        - type: string
    isEnlargedCavalry:
      args:
        - type: string
    isEnlargedEliteTroop:
      args:
        - type: string
    isHero:
      args:
        - type: string
    isPriest:
      args:
        - type: string
    isSingleEntity:
      args:
        - type: string
    isVampiric:
      args:
        - type: string
    isVarghulf:
      args:
        - type: string

  IdrinthVersion:
    bug:
      property: read-only
    feature:
      property: read-only
    main:
      property: read-only
    iteration:
      property: read-only

  Idrinth:
    Access:
      struct: IdrinthAccess
    Constants:
      struct: IdrinthConstants
    Cultures:
      struct: IdrinthCultures
    Events:
      struct: IdrinthEvents
    Mct:
      struct: IdrinthMct
    Names:
      property: read-only
    Statistics:
      struct: IdrinthStatistics
    Ui:
      struct: IdrinthUi
    Unittypes:
      struct: IdrinthUnittypes
    Version:
      struct: IdrinthVersion
    factions:
      property: read-only
    log:
      args:
        - type: any
        - type: string
          required: false
    mayConfigure:
      args: []

globals:
  Idrinth:
    property: full-write
    struct: Idrinth
