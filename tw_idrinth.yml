  # Common utilities struct
  Common:
    call_context_command:
      method: true
      args: []
    get_context_value:
      method: true
      args: []
    get_localised_string:
      method: true
      args: []

  # Idrinth sub-structs
  IdrinthAccess:
    get:
      args: []
    spawned:
      args: []

  IdrinthConstantsCultures:
    DarkElves:
      property: read-only
    HighElves:
      property: read-only
    WoodElves:
      property: read-only

  IdrinthConstantsGods:
    Asuryan:
      property: read-only
    Khaine:
      property: read-only
    Kurnous:
      property: read-only

  IdrinthConstantsPanels:
    HudCampaign:
      property: read-only

  IdrinthConstants:
    Cultures:
      struct: IdrinthConstantsCultures
    GodList:
      property: read-only
    Gods:
      struct: IdrinthConstantsGods
    HeroSubtype:
      property: read-only
    HeroType:
      property: read-only
    LordSubtype:
      property: read-only
    LordType:
      property: read-only
    MctModKey:
      property: read-only
    Panels:
      struct: IdrinthConstantsPanels
    UnlockDilemma:
      property: read-only

  IdrinthCultures:
    get:
      args: []
    isAllowed:
      args:
        - type: string

  IdrinthEventsConditions:
    battleFoughtAndSpawned:
      args: []
    dilemmaIs:
      args:
        - type: string
    isPanelOpen:
      args:
        - type: string
    panelOpened:
      args:
        - type: string

  IdrinthEvents:
    Conditions:
      struct: IdrinthEventsConditions
    addListener:
      args:
        - type: string
        - type: function
        - type: function
    onMctChange:
      args:
        - type: function

  IdrinthMct:
    get:
      args:
        - type: string

  IdrinthStatistics:
    ActiveRounds:
      property: read-only
    BattlesFought:
      property: read-only
    CharactersAssassinated:
      property: read-only

  IdrinthUi:
    countChildrenWhere:
      args:
        - type: any
        - type: function
    createOrFind:
      args:
        - type: any
        - type: string
    findChildWhere:
      args:
        - type: any
        - type: function
    findElementWithin:
      args:
        - type: any
        - type: string
    forEachChild:
      args:
        - type: any
        - type: function
    nowAndThen:
      args:
        - type: any
        - type: function

  IdrinthUnittypes:
    isBlessedAnimal:
      args:
        - type: string
    isChapelUnit:
      args:
        - type: string
    isEliteTroop:
      args:
        - type: string
    isEnlargedCavalry:
      args:
        - type: string
    isEnlargedEliteTroop:
      args:
        - type: string
    isHero:
      args:
        - type: string
    isPriest:
      args:
        - type: string
    isSingleEntity:
      args:
        - type: string
    isVampiric:
      args:
        - type: string
    isVarghulf:
      args:
        - type: string

  IdrinthVersion:
    bug:
      property: read-only
    feature:
      property: read-only
    main:
      property: read-only

  Idrinth:
    Access:
      struct: IdrinthAccess
    Constants:
      struct: IdrinthConstants
    Cultures:
      struct: IdrinthCultures
    Events:
      struct: IdrinthEvents
    Mct:
      struct: IdrinthMct
    Names:
      property: read-only
    Statistics:
      struct: IdrinthStatistics
    Ui:
      struct: IdrinthUi
    Unittypes:
      struct: IdrinthUnittypes
    Version:
      struct: IdrinthVersion
    factions:
      property: read-only
    log:
      args:
        - type: string
    mayConfigure:
      args: []

globals:
  # ============================================
  # Total War Game API
  # ============================================

  core:
    struct: Core

  cm:
    struct: CampaignManager

  common:
    struct: Common

  # Simple read-only globals (functions)
  is_string:
    args:
      - type: any
  is_integer:
    args:
      - type: any
  UIComponent:
    args:
      - type: any
  is_uicomponent:
    args:
      - type: any
  get_mct:
    args: []
  set_component_visible_with_parent:
    args:
      - type: any
      - type: bool
  out:
    args:
      - type: string

  # ============================================
  # Idrinth Mod Namespace
  # ============================================

  Idrinth:
    property: full-write
    struct: Idrinth
