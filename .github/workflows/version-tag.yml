name: Tag Version

on:
  push:
    branches:
      - the-one
    paths:
      - 'idrinth/script/idrinth/version.lua'

jobs:
  tag-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from version.lua
        id: version
        run: |
          MAIN=$(grep 'main\s*=' idrinth/script/idrinth/version.lua | sed 's/[^0-9]*//g')
          FEATURE=$(grep 'feature\s*=' idrinth/script/idrinth/version.lua | sed 's/[^0-9]*//g')
          BUG=$(grep 'bug\s*=' idrinth/script/idrinth/version.lua | sed 's/[^0-9]*//g')
          VERSION="v${MAIN}.${FEATURE}.${BUG}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete existing tag if present
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            git push origin --delete "$VERSION"
          fi

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
