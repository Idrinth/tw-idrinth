name: Translations
on:
  push:
    branches:
    - the-one
  pull_request:
    branches:
    - the-one
jobs:
  check-unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check for unused translation keys
        run: python scripts/check_unused_translations.py
