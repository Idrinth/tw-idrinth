name: Translations
on:
  push:
    branches:
    - the-one
    paths:
    - '**.loc'
    - '**.tsv'
    - '**.twui.xml'
    - '**.lua'
  pull_request:
    branches:
    - the-one
    paths:
    - '**.loc'
    - '**.tsv'
    - '**.twui.xml'
    - '**.lua'
jobs:
  check-unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check for unused translation keys
        run: python scripts/check_unused_translations.py
