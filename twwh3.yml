# Selene standard library definition for Total War: Warhammer 3
# Base game API definitions for reuse by any mod
# See: https://chadvandy.github.io/tw_modding_resources/WH3/campaign/

name: twwh3
base: lua51

structs:
  # Core object struct
  # See: https://chadvandy.github.io/tw_modding_resources/WH3/script/_lib/lib_core.html
  Core:
    add_listener:
      method: true
      args:
      - type: string
      - type: string
      - type: any
      - type: function
      - type: bool
        required: false
    get_or_create_component:
      method: true
      args:
      - type: string
      - type: string
      - type:
          display: UIComponent
    get_ui_root:
      must_use: true
      method: true
      args: []
    is_ui_created:
      must_use: true
      method: true
      args: []
    trigger_custom_event:
      method: true
      args: []

  # Campaign manager struct
  # See: https://chadvandy.github.io/tw_modding_resources/WH3/campaign/campaign_manager.html
  CampaignManager:
    add_experience_to_unit:
      method: true
      args: []
    add_first_tick_callback:
      method: true
      args: []
    add_foreign_slot_set_to_region_for_faction:
      method: true
      args: []
    add_loading_game_callback:
      method: true
      args: []
    add_pooled_resource_changed_listener_by_faction:
      method: true
      args: []
    add_pre_first_tick_callback:
      method: true
      args: []
    add_saving_game_callback:
      method: true
      args: []
    apply_effect_bundle:
      method: true
      args: []
    apply_effect_bundle_to_character:
      method: true
      args: []
    apply_effect_bundle_to_region:
      method: true
      args: []
    callback:
      method: true
      args: []
    cancel_custom_mission:
      method: true
      args: []
    change_character_custom_name:
      method: true
      args: []
    change_custom_unit_name:
      method: true
      args: []
    char_lookup_str:
      must_use: true
      method: true
      args: []
    create_force_with_general:
      method: true
      args: []
    disable_event_feed_events:
      method: true
      args:
      - type: bool
    faction_add_pooled_resource:
      method: true
      args: []
    faction_purchase_unit_effect:
      method: true
      args: []
    faction_set_unit_purchasable_effect_lock_state:
      method: true
      args: []
    find_valid_spawn_location_for_character_from_position:
      must_use: true
      method: true
      args: []
    force_add_ancillary:
      method: true
      args: []
    force_add_trait:
      method: true
      args: []
    force_remove_ancillary_from_faction:
      method: true
      args: []
    force_remove_trait:
      method: true
      args: []
    get_campaign_ui_manager:
      must_use: true
      method: true
      args: []
    get_character_by_cqi:
      must_use: true
      method: true
      args: []
    get_factions_by_culture:
      must_use: true
      method: true
      args: []
    get_highest_ranked_general_for_faction:
      must_use: true
      method: true
      args: []
    get_local_faction:
      must_use: true
      method: true
      args: []
    get_most_recently_created_character_of_type:
      must_use: true
      method: true
      args: []
    grant_unit_to_character:
      method: true
      args: []
    is_multiplayer:
      must_use: true
      method: true
      args: []
    is_new_game:
      must_use: true
      method: true
      args: []
    load_global_script:
      method: true
      args:
      - type: string
    load_named_value:
      must_use: true
      method: true
      args:
      - type: string
      - type: any
      - type: any
    mission_is_active_for_faction:
      must_use: true
      method: true
      args: []
    model:
      method: true
      args: []
    pending_battle_cache_attacker_value:
      must_use: true
      method: true
      args: []
    pending_battle_cache_attacker_victory:
      must_use: true
      method: true
      args: []
    pending_battle_cache_culture_is_attacker:
      must_use: true
      method: true
      args: []
    pending_battle_cache_culture_is_defender:
      must_use: true
      method: true
      args: []
    pending_battle_cache_defender_value:
      must_use: true
      method: true
      args: []
    pending_battle_cache_defender_victory:
      must_use: true
      method: true
      args: []
    pending_battle_cache_get_attacker:
      must_use: true
      method: true
      args: []
    pending_battle_cache_get_attacker_embedded_character_subtypes:
      must_use: true
      method: true
      args: []
    pending_battle_cache_get_defender:
      must_use: true
      method: true
      args: []
    pending_battle_cache_get_defender_embedded_character_subtypes:
      must_use: true
      method: true
      args: []
    pending_battle_cache_num_attackers:
      must_use: true
      method: true
      args: []
    pending_battle_cache_num_defenders:
      must_use: true
      method: true
      args: []
    pooled_resource_factor_transaction:
      method: true
      args: []
    random:
      method: true
      args: []
    random_number:
      method: true
      args: []
    real_callback:
      method: true
      args: []
    remove_effect_bundle_from_region:
      method: true
      args: []
    remove_faction_foreign_slots_from_region:
      method: true
      args: []
    repeat_real_callback:
      method: true
      args: []
    replenish_action_points:
      method: true
      args: []
    save_named_value:
      method: true
      args: []
    set_character_immortality:
      method: true
      args: []
    set_character_unique:
      method: true
      args: []
    show_message_event:
      method: true
      args: []
    show_message_event_located:
      method: true
      args: []
    spawn_transported_force_at_military_force:
      method: true
      args: []
    spawn_unique_agent_at_character:
      method: true
      args: []
    spawn_unique_agent_at_region:
      method: true
      args: []
    treasury_mod:
      method: true
      args: []
    trigger_dilemma:
      method: true
      args: []
    trigger_mission:
      method: true
      args: []

  # Common utilities struct
  # See: https://chadvandy.github.io/tw_modding_resources/WH3/script/_lib/lib_common.html
  Common:
    call_context_command:
      method: true
      args: []
    get_context_value:
      must_use: true
      method: true
      args: []
    get_localised_string:
      must_use: true
      method: true
      args: []

globals:
  # Core game objects
  core:
    struct: Core

  cm:
    struct: CampaignManager

  common:
    struct: Common

  # Utility functions
  # See: https://chadvandy.github.io/tw_modding_resources/WH3/script/_lib/lib_common.html
  is_string:
    must_use: true
    args:
      - type: any
  is_integer:
    must_use: true
    args:
      - type: any
  UIComponent:
    must_use: true
    args:
      - type: any
  is_uicomponent:
    must_use: true
    args:
      - type: any
  get_mct:
    must_use: true
    args: []
  set_component_visible_with_parent:
    args:
      - type: any
      - type: bool
  out:
    args:
      - type: string
